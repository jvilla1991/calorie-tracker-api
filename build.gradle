plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.calorietracker'
version = '0.0.1-SNAPSHOT'
description = 'Calorie and macro tracker REST API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// spring-boot-starter-flyway does not exist in Spring Boot 4.x; configure Flyway manually via FlywayConfig.java
	implementation 'org.flywaydb:flyway-database-postgresql'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// AWS SDK v2: S3 storage for meal photos (see photo/PhotoStorageConfig.java).
	// Only the synchronous S3 client is used, over the JDK's own HTTP stack (url-connection-client).
	// The SDK's default HTTP clients are excluded on purpose:
	//  - Spring Boot's dependency management would pin their Apache HttpClient 5 / Netty libraries
	//    to versions the SDK was not built against (it downgrades httpclient5 5.6 -> 5.5);
	//  - with Apache HttpClient 5 on the classpath, RestClient.builder() (OpenFoodFactsClient)
	//    would silently switch to it instead of the JDK client.
	implementation platform('software.amazon.awssdk:bom:2.55.10')
	implementation('software.amazon.awssdk:s3') {
		exclude group: 'software.amazon.awssdk', module: 'apache5-client'
		exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
	}
	implementation 'software.amazon.awssdk:url-connection-client'

	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// To run locally via CLI: ./gradlew bootRun --args='--spring.profiles.active=local'
// In IntelliJ: Run → Edit Configurations → Active profiles → local
