# Production profile — loaded when SPRING_PROFILES_ACTIVE=prod
#
# All sensitive values are injected by App Runner from Secrets Manager as
# environment variables. Spring Boot's relaxed binding maps them automatically:
#
#   SPRING_DATASOURCE_URL      → spring.datasource.url
#   SPRING_DATASOURCE_USERNAME → spring.datasource.username
#   SPRING_DATASOURCE_PASSWORD → spring.datasource.password
#   APP_JWT_SECRET             → app.jwt.secret
#   APP_ADMIN_PASSWORD         → app.admin.password
#   CORS_ALLOWED_ORIGINS       → cors.allowed-origins
#
# No need to reference them explicitly here — relaxed binding handles it.

# Reduce log verbosity in production
logging.level.root=WARN
logging.level.com.calorietracker=INFO
logging.level.org.springframework.web=WARN

# Actuator: expose only health (already set in application.properties, repeated for clarity)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Meal photo storage (S3). Set by Terraform on the App Runner service:
#   MEDIA_BUCKET  name of the private S3 bucket for meal photos
#   MEDIA_REGION  the bucket's region (defaults to us-east-1)
# Credentials come from the AWS default provider chain: the App Runner instance role, whose
# policy allows s3:PutObject/GetObject/DeleteObject on the bucket. Nothing secret goes here.
#
# If MEDIA_BUCKET is missing or blank, the API still starts and everything else works: a WARN is
# logged at startup and the photo endpoints (upload, view, delete) answer
# 503 {"message": "Photo storage not configured"}. Diary responses still list existing photos.
# (Outside the prod profile a blank bucket means local filesystem storage instead; see
# com.calorietracker.photo.PhotoStorageConfig.)
app.media.bucket=${MEDIA_BUCKET:}
app.media.region=${MEDIA_REGION:us-east-1}
