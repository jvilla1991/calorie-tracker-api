# Production profile — loaded when SPRING_PROFILES_ACTIVE=prod
#
# All sensitive values are injected by App Runner from Secrets Manager as
# environment variables. Spring Boot's relaxed binding maps them automatically:
#
#   SPRING_DATASOURCE_URL      → spring.datasource.url
#   SPRING_DATASOURCE_USERNAME → spring.datasource.username
#   SPRING_DATASOURCE_PASSWORD → spring.datasource.password
#   APP_JWT_SECRET             → app.jwt.secret
#   APP_ADMIN_PASSWORD         → app.admin.password
#   CORS_ALLOWED_ORIGINS       → cors.allowed-origins
#
# No need to reference them explicitly here — relaxed binding handles it.

# Reduce log verbosity in production
logging.level.root=WARN
logging.level.com.calorietracker=INFO
logging.level.org.springframework.web=WARN

# Actuator: expose only health (already set in application.properties, repeated for clarity)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
