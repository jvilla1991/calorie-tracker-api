name: Build & Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  JAVA_VERSION: "21"

jobs:
  build-and-deploy:
    name: Build, push & deploy
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v4

      # ── Build ────────────────────────────────────────────────────────────────

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Build JAR (skip tests — tested in CI job)
        run: ./gradlew bootJar --no-daemon -x test

      # ── AWS credentials via OIDC ─────────────────────────────────────────────

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── ECR ──────────────────────────────────────────────────────────────────

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        env:
          IMAGE_URI: ${{ secrets.ECR_REPOSITORY_URL }}:latest
          COMMIT_URI: ${{ secrets.ECR_REPOSITORY_URL }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE_URI" -t "$COMMIT_URI" .
          docker push "$IMAGE_URI"
          docker push "$COMMIT_URI"

      # ── App Runner ───────────────────────────────────────────────────────────
      # App Runner has auto_deployments_enabled = false; we trigger manually
      # so we can verify the deployment completes successfully.

      - name: Deploy to App Runner
        env:
          SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
        run: |
          aws apprunner update-service \
            --service-arn "$SERVICE_ARN" \
            --source-configuration '{
              "ImageRepository": {
                "ImageIdentifier": "${{ secrets.ECR_REPOSITORY_URL }}:latest",
                "ImageRepositoryType": "ECR"
              },
              "AutoDeploymentsEnabled": false
            }' \
            --region "$AWS_REGION"

      - name: Wait for App Runner deployment
        env:
          SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
        run: |
          echo "Waiting for App Runner service to reach RUNNING state..."
          for i in $(seq 1 30); do
            STATUS=$(aws apprunner describe-service \
              --service-arn "$SERVICE_ARN" \
              --query 'Service.Status' \
              --output text \
              --region "$AWS_REGION")
            echo "  Status: $STATUS"
            if [ "$STATUS" = "RUNNING" ]; then
              echo "Deployment complete."
              exit 0
            elif [ "$STATUS" = "CREATE_FAILED" ] || [ "$STATUS" = "DELETE_FAILED" ]; then
              echo "Deployment failed with status: $STATUS"
              exit 1
            fi
            sleep 20
          done
          echo "Timed out waiting for deployment."
          exit 1
