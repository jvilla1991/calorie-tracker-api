spring.application.name=calorie-tracker-api

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Multipart uploads (meal photos). These are the container's hard caps; the photo endpoint
# applies tighter limits itself (full <= 3 MB, thumb <= 500 KB). A request over these caps is
# answered 413 with a JSON {"message": ...} body.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=8MB
